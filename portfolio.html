<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work — Leah Social Media & Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple:     #7C5CBF;
  --purple-btn: #6B4EAA;
  --purple-dark:#2D1B69;
  --navy:       #1E1340;
  --cream:      #FAF1E7;
  --cream-card: #EDE2D6;
  --dark:       #1A1A2E;
  --text:       #2C2C3A;
  --muted:      #6B6880;
  --border:     #2C2C3A;
  --white:      #ffffff;
  --display: 'Playfair Display', Georgia, serif;
  --sans:    'Nunito Sans', system-ui, sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--cream);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 66px;
  background: var(--cream);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  padding: 0 24px;
}
.nav-inner {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-logo { display: flex; align-items: center; text-decoration: none; }
.nav-logo img { height: 44px; width: auto; display: block; }
.nav-links {
  display: flex; align-items: center; gap: 42px;
  list-style: none; margin: 0; padding: 0;
}
.nav-links a {
  font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
  font-weight: 700; color: var(--text); text-decoration: none;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--purple); }

/* ── PAGE HEADER ── */
#work-header {
  padding: 150px 3rem 0;
  max-width: 1200px;
  margin: 0 auto;
}
.section-eyebrow {
  font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--purple); font-weight: 700; margin-bottom: 0.6rem;
}
.section-title {
  font-family: var(--display);
  font-size: 2.8rem; font-weight: 800; line-height: 1.15;
  color: var(--text); margin-bottom: 2.5rem;
}
.section-title em { font-style: italic; }

/* ── FULL PORTFOLIO GRID ── */
#work-grid { padding: 0 3rem 5.5rem; }
.portfolio-grid-full {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 220px 320px 220px 220px;
  gap: 1rem;
}
.g-item {
  background: var(--cream-card);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  width: 100%;
  height: 100%;
}
.g-item:hover {
  transform: scale(1.015);
  box-shadow: 0 10px 32px rgba(0,0,0,0.12);
}
.g-item img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  display: block;
}
/* the wide "large" tile — spans the first two columns of its row */
.g-item.wide { grid-column: span 2; }

/* ── CONTACT (reused from home) ── */
#contact { background: var(--navy); padding: 5.5rem 3rem; }
.contact-inner {
  max-width: 1100px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
}
.contact-eyebrow {
  font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(255,255,255,0.45); font-weight: 700; margin-bottom: 0.75rem;
}
.contact-title {
  font-family: var(--display);
  font-size: 3rem; font-weight: 900; line-height: 1.1;
  color: var(--white); margin-bottom: 1.25rem;
}
.contact-sub { font-size: 0.95rem; color: rgba(255,255,255,0.5); line-height: 1.7; }
.form-field { margin-bottom: 1rem; }
.form-field input {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  padding: 0.9rem 1rem;
  color: var(--white);
  font-family: var(--sans);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}
.form-field input::placeholder { color: rgba(255,255,255,0.35); }
.form-field input:focus { border-color: var(--purple); }
.form-label {
  display: block;
  font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.4); margin-top: 0.35rem; padding-left: 0.2rem;
}
.btn-purple-full {
  width: 100%; padding: 1rem;
  background: var(--purple); color: var(--white);
  font-family: var(--sans); font-size: 0.78rem;
  font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  border: none; border-radius: 4px; cursor: pointer;
  margin-top: 0.5rem;
  transition: background 0.2s;
}
.btn-purple-full:hover { background: var(--purple-btn); }

/* ── FOOTER ── */
footer {
  background: #111;
  padding: 2rem 3rem;
  display: flex; align-items: center; justify-content: space-between;
}
.footer-logo { display: flex; align-items: center; gap: 0.5rem; }
.footer-copy { font-size: 0.75rem; color: rgba(255,255,255,0.25); }
.footer-links { display: flex; gap: 1.5rem; }
.footer-links a {
  font-size: 0.75rem; color: rgba(255,255,255,0.35); text-decoration: none;
  letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s;
}
.footer-links a:hover { color: white; }

/* ── MOBILE ── */
@media (max-width: 900px) {
  nav { padding: 0.85rem 1.25rem; }
  .nav-links li:not(:last-child) { display: none; }
  #work-header { padding: 110px 1.25rem 0; }
  .section-title { font-size: 2.1rem; }
  #work-grid { padding: 0 1.25rem 4rem; }
  .portfolio-grid-full {
    grid-template-columns: 1fr;
    grid-template-rows: none;
  }
  .g-item, .g-item.wide {
    grid-column: auto;
    height: 260px;
  }
  #contact { padding: 4rem 1.25rem; }
  .contact-inner { grid-template-columns: 1fr; gap: 2.5rem; }
  .contact-title { font-size: 2.2rem; }
  footer { flex-direction: column; gap: 1rem; text-align: center; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="Logo.png" alt="Leah Social">
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="portfolio.html" class="active">Our Work</a></li>
      <li><a href="index.html#contact">Contact Us</a></li>
    </ul>
  </div>
</nav>

<!-- PAGE HEADER -->
<section id="work-header">
  <p class="section-eyebrow">Our Work</p>
  <h2 class="section-title">Stories we've helped <em>tell</em></h2>
</section>

<!-- FULL PORTFOLIO GRID -->
<section id="work-grid">
  <div class="portfolio-grid-full">
    <!-- Row 1 -->
    <div class="g-item">     <img src="Social Media SPA.png" alt="Social Media SPA"> </div>
    <div class="g-item">     <img src="YT.png" alt="YouTube"> </div>
    <div class="g-item">     <img src="Eblast.png" alt="Email Marketing"> </div>

    <!-- Row 2: wide tile + tall tile -->
    <div class="g-item wide">     <img src="Banners.png" alt="Banners"> </div>
    <div class="g-item"><!-- <img src="work-05.png" alt=""> --></div>

    <!-- Row 3 -->
    <div class="g-item"><!-- <img src="work-06.png" alt=""> --></div>
    <div class="g-item"><!-- <img src="work-07.png" alt=""> --></div>
    <div class="g-item"><!-- <img src="work-08.png" alt=""> --></div>

    <!-- Row 4 -->
    <div class="g-item"><!-- <img src="work-09.png" alt=""> --></div>
    <div class="g-item"><!-- <img src="work-10.png" alt=""> --></div>
    <div class="g-item"><!-- <img src="work-11.png" alt=""> --></div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="contact-inner">
    <div class="contact-left">
      <p class="contact-eyebrow">Let's Talk</p>
      <h2 class="contact-title">Book Your Free<br>Social Media<br>Audit &amp; Consult</h2>
      <p class="contact-sub">Let's turn your vision into a digital presence that truly connects with people.</p>
    </div>
    <div class="contact-right">
      <form onsubmit="return false;">
        <div class="form-field">
          <input type="text" placeholder="Your name" id="fname">
          <label for="fname" class="form-label">Name</label>
        </div>
        <div class="form-field">
          <input type="email" placeholder="your@email.com" id="femail">
          <label for="femail" class="form-label">Email</label>
        </div>
        <button type="submit" class="btn-purple-full">Book Your Free Consult</button>
      </form>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">
    <img src="Logo.png" alt="Leah Social" style="height:38px; width:auto; filter: brightness(0) invert(1);">
  </div>
  <span class="footer-copy">&copy; 2025 Leah Social Media &amp; Graphic Design</span>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="portfolio.html">Work</a>
    <a href="index.html#contact">Contact</a>
  </div>
</footer>

</body>
</html>
